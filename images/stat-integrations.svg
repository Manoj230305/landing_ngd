<svg width="76" height="76" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#84D83C" />
      <stop offset="30%" stop-color="#46C69A" />
      <stop offset="70%" stop-color="#2CA6EC" />
      <stop offset="100%" stop-color="#239DE3" />
    </linearGradient>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#29A8EB" flood-opacity="0.10" />
